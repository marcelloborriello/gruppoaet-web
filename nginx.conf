# nginx — gruppoaet.it (sito statico)
# www.gruppoaet.it -> gruppoaet.it
server {
    listen 80;
    server_name www.gruppoaet.it;
    return 301 https://gruppoaet.it$request_uri;
}

# anteprima aet.zerofloor.it: solo /proposte/ resta qui, il resto rimanda al dominio ufficiale
server {
    listen 80;
    server_name aet.zerofloor.it;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;
    location /proposte/ { add_header X-Robots-Tag "noindex, nofollow" always; try_files $uri $uri/ =404; }
    location /assets/ { expires 30d; add_header Cache-Control "public"; }
    location / { return 301 https://gruppoaet.it$request_uri; }
}

server {
    listen 80 default_server;
    server_name gruppoaet.it _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    # compressione
    gzip on; gzip_vary on; gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # sicurezza
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # vecchi PDF caricati su WordPress
    location ~ ^/wp-content/uploads/(?:.*/)?([^/]+\.pdf)$ { return 301 /assets/docs/$1; }

    # cache
    location ~* \.(css|js|woff2|png|jpe?g|webp|svg|ico|pdf)$ { expires 30d; add_header Cache-Control "public"; }

    # vecchi permalink WordPress ?p=ID
    location = / {
        if ($arg_p = 58) { return 301 /; }
        if ($arg_p = 1433) { return 301 /en/; }
        if ($arg_p = 625) { return 301 /storia/; }
        if ($arg_p = 1677) { return 301 /en/history/; }
        if ($arg_p = 691) { return 301 /mission/; }
        if ($arg_p = 1615) { return 301 /en/mission/; }
        if ($arg_p = 703) { return 301 /codice-etico/; }
        if ($arg_p = 1568) { return 301 /en/code-of-ethics/; }
        if ($arg_p = 722) { return 301 /il-gruppo/; }
        if ($arg_p = 1605) { return 301 /en/the-group/; }
        if ($arg_p = 821) { return 301 /partner-e-fornitori/; }
        if ($arg_p = 1686) { return 301 /en/partners-and-suppliers/; }
        if ($arg_p = 844) { return 301 /associazioni/; }
        if ($arg_p = 1551) { return 301 /en/associations/; }
        if ($arg_p = 858) { return 301 /armamento/; }
        if ($arg_p = 1540) { return 301 /en/track-systems/; }
        if ($arg_p = 1089) { return 301 /impianti-tecnologici/; }
        if ($arg_p = 1610) { return 301 /en/technological-systems/; }
        if ($arg_p = 1115) { return 301 /opere-civili/; }
        if ($arg_p = 1642) { return 301 /en/civil-works/; }
        if ($arg_p = 1154) { return 301 /progetti-in-corso/; }
        if ($arg_p = 1653) { return 301 /en/ongoing-projects/; }
        if ($arg_p = 1180) { return 301 /progetti-completati/; }
        if ($arg_p = 1658) { return 301 /en/completed-projects/; }
        if ($arg_p = 1260) { return 301 /i-nostri-clienti/; }
        if ($arg_p = 1600) { return 301 /en/our-clients/; }
        if ($arg_p = 923) { return 301 /certificazioni/; }
        if ($arg_p = 1560) { return 301 /en/certifications/; }
        if ($arg_p = 2369) { return 301 /regolamento-whistleblowing/; }
        if ($arg_p = 2445) { return 301 /en/whistleblowing-policy/; }
        if ($arg_p = 2311) { return 301 /informativa-whistleblowing/; }
        if ($arg_p = 2430) { return 301 /en/whistleblowing-notice/; }
        if ($arg_p = 1037) { return 301 /contatti/; }
        if ($arg_p = 1573) { return 301 /en/contacts/; }
        if ($arg_p = 1000) { return 301 /news/; }
        if ($arg_p = 1620) { return 301 /en/news/; }
        if ($arg_p = 1077) { return 301 /dati-societari/; }
        if ($arg_p = 1595) { return 301 /en/company-data/; }
        if ($arg_p = 1350) { return 301 /privacy-policy/; }
        if ($arg_p = 1663) { return 301 /en/privacy-policy/; }
        if ($arg_p = 1358) { return 301 /cookie-policy/; }
        if ($arg_p = 1584) { return 301 /en/cookie-policy/; }
        if ($arg_p = 2481) { return 301 /news/aet-rinnova-elite-2025/; }
        if ($arg_p = 2508) { return 301 /en/news/aet-in-elite-program-2025/; }
        if ($arg_p = 2085) { return 301 /news/premio-industria-felix-2024/; }
        if ($arg_p = 2108) { return 301 /en/news/industria-felix-award-2024/; }
        if ($arg_p = 976) { return 301 /news/aet-al-programma-elite/; }
        if ($arg_p = 1492) { return 301 /en/news/aet-in-the-elite-program/; }
        if ($arg_p = 958) { return 301 /news/premio-industria-felix-2019/; }
        if ($arg_p = 1502) { return 301 /en/news/industria-felix-award-2019/; }
        if ($arg_p = 265) { return 301 /news/aet-nel-segnalamento-ferroviario/; }
        if ($arg_p = 1506) { return 301 /en/news/aet-enters-the-railway-signaling-sector/; }
        try_files $uri $uri/ /index.html;
    }

    # redirect dai vecchi URL (Polylang /en-gb/, slug cambiati, news alla radice)
    location = /en-gb/homepage-en/ { return 301 /en/; }
    location = /en-gb/storia-copy/ { return 301 /en/history/; }
    location = /en-gb/mission-copy/ { return 301 /en/mission/; }
    location = /en-gb/codice-etico-2/ { return 301 /en/code-of-ethics/; }
    location = /en-gb/il-gruppo-copy/ { return 301 /en/the-group/; }
    location = /en-gb/partner-e-fornitori-copy/ { return 301 /en/partners-and-suppliers/; }
    location = /en-gb/associazioni-2/ { return 301 /en/associations/; }
    location = /en-gb/armamento-2/ { return 301 /en/track-systems/; }
    location = /en-gb/impianti-tecnologici-copy/ { return 301 /en/technological-systems/; }
    location = /en-gb/opere-civili-copy/ { return 301 /en/civil-works/; }
    location = /en-gb/progetti-in-corso-copy/ { return 301 /en/ongoing-projects/; }
    location = /en-gb/progetti-completati-copy/ { return 301 /en/completed-projects/; }
    location = /en-gb/i-nostri-clienti-copy/ { return 301 /en/our-clients/; }
    location = /en-gb/certificazioni-copy/ { return 301 /en/certifications/; }
    location = /en-gb/regolamento-whistleblowing-en/ { return 301 /en/whistleblowing-policy/; }
    location = /en-gb/informativa-whistleblowing-en/ { return 301 /en/whistleblowing-notice/; }
    location = /en-gb/contatti-copy/ { return 301 /en/contacts/; }
    location = /en-gb/news-copy/ { return 301 /en/news/; }
    location = /en-gb/dati-societari-copy/ { return 301 /en/company-data/; }
    location = /en-gb/privacy-policy-copy/ { return 301 /en/privacy-policy/; }
    location = /privacy-policy-2/ { return 301 /privacy-policy/; }
    location = /en-gb/cookie-policy-copy/ { return 301 /en/cookie-policy/; }
    location = /en-gb/aet-in-elite-program-2025/ { return 301 /en/news/aet-in-elite-program-2025/; }
    location = /aet-rinnova-elite-2025/ { return 301 /news/aet-rinnova-elite-2025/; }
    location = /en-gb/industria-felix-award-2024/ { return 301 /en/news/industria-felix-award-2024/; }
    location = /premio-industria-felix-2024/ { return 301 /news/premio-industria-felix-2024/; }
    location = /en-gb/aet-al-programma-elite-en/ { return 301 /en/news/aet-in-the-elite-program/; }
    location = /aet-al-programma-elite/ { return 301 /news/aet-al-programma-elite/; }
    location = /en-gb/industria-felix-awars/ { return 301 /en/news/industria-felix-award-2019/; }
    location = /premio-industria-felix-2/ { return 301 /news/premio-industria-felix-2019/; }
    location = /en-gb/aet-enters-the-railway-signaling-sector/ { return 301 /en/news/aet-enters-the-railway-signaling-sector/; }
    location = /aet-nel-segnalamento-ferroviario/ { return 301 /news/aet-nel-segnalamento-ferroviario/; }
    location = /en-gb/ { return 301 /en/; }
    location ~ ^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|wp-includes|wp-content) { return 404; }

    # proposte di design: vivono solo sull'anteprima
    location /proposte/ { return 301 https://aet.zerofloor.it$request_uri; }

    # endpoint del form contatti (servizio separato, vedi form/README.md)
    location /api/contact {
        return 503;
    }

    # pagine statiche con URL "puliti" (/storia/ -> /storia/index.html)
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
